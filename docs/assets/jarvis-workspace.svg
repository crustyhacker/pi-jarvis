<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1134" viewBox="0 0 640 1134" role="img" aria-labelledby="title desc">
<title id="title">Two lanes. Shared local memory.</title>
<desc id="desc">Conceptual workspace: main Pi sends a summary and recent delta to an isolated Jarvis session, not a full context copy. Both explicitly mount shared local plaintext memory, on in trusted projects. Recall is bounded to global and current-project facts, not higher-priority instructions. Recalled facts can reach the active model/provider. No automatic steering or task handoff. Memory, archive, Repo tools and bridge controls are independent.</desc>
<defs>
<linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#111a32"/><stop offset="1" stop-color="#080f20"/></linearGradient>
<linearGradient id="panel" x2="0" y2="1"><stop stop-color="#18263e"/><stop offset="1" stop-color="#111c31"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#ad87ff"/></linearGradient>
</defs>
<rect width="640" height="1134" rx="28" fill="url(#canvas)"/>
<rect x="1" y="1" width="638" height="1132" rx="27" fill="none" stroke="#344663"/>
<path d="M40 12H600" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="26" fill="#67e8f9" font-weight="600">01 / THE WORKSPACE</text><text x="40" y="94" font-size="34" fill="#edf4ff" font-weight="700">Two lanes. Shared memory.</text><text x="40" y="132" font-size="26" fill="#bbcae2" font-weight="400">A second opinion, without losing focus.</text><path d="M40 230H20V770H40M20 516H40" fill="none" stroke="#c4a5ff" stroke-width="2"/><circle cx="20" cy="516" r="4" fill="#c4a5ff"/><g id="main-lane" data-card="main-lane" data-bounds="40 164 560 132"><rect x="40" y="164" width="560" height="132" rx="22" fill="url(#panel)" stroke="#344663" stroke-width="1.5"/><text x="64" y="208" font-size="30" fill="#67e8f9" font-weight="700">Main Pi / primary session</text><text x="64" y="250" font-size="26" fill="#edf4ff" font-weight="400">Keep your primary task moving.</text></g><path d="M320 296V322M320 392V420M312 410L320 420L328 410" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/><text x="320" y="351" font-size="26" fill="#67e8f9" font-weight="600" text-anchor="middle">Main context → Jarvis only</text><text x="320" y="387" font-size="26" fill="#bbcae2" font-weight="400" text-anchor="middle">Summary + delta, not a full copy</text><g id="jarvis-lane" data-card="jarvis-lane" data-bounds="40 428 560 178"><rect x="40" y="428" width="560" height="178" rx="22" fill="url(#panel)" stroke="#344663" stroke-width="1.5"/><text x="64" y="472" font-size="30" fill="#c4a5ff" font-weight="700">Jarvis / isolated side session</text><text x="64" y="514" font-size="26" fill="#edf4ff" font-weight="400">Own model &amp; thinking • scrollback</text><text x="64" y="552" font-size="26" fill="#edf4ff" font-weight="400">Multiline draft • persistent history</text></g><text x="320" y="654" font-size="26" fill="#c4a5ff" font-weight="400" text-anchor="middle">Both lanes mount the same local store</text><g id="shared-memory" data-card="shared-memory" data-bounds="40 684 560 296"><rect x="40" y="684" width="560" height="296" rx="22" fill="url(#panel)" stroke="#c4a5ff" stroke-width="1.5"/><text x="64" y="728" font-size="30" fill="#c4a5ff" font-weight="700">Shared local memory</text><text x="64" y="770" font-size="26" fill="#edf4ff" font-weight="400">Preferences • decisions • search</text><text x="64" y="810" font-size="26" fill="#67e8f9" font-weight="400">ON in trusted projects • plaintext</text><text x="64" y="850" font-size="26" fill="#edf4ff" font-weight="400">Bounded recall: global + this project</text><text x="64" y="890" font-size="26" fill="#edf4ff" font-weight="400">Facts are context, not instructions.</text><path d="M64 911H576" fill="none" stroke="#344663" stroke-width="2"/><text x="64" y="952" font-size="26" fill="#bbcae2" font-weight="400">Recalls may reach your model/provider.</text></g><text x="320" y="1026" font-size="26" fill="#bbcae2" font-weight="400" text-anchor="middle">Memory, archive &amp; tool/bridge access</text><text x="320" y="1064" font-size="26" fill="#bbcae2" font-weight="400" text-anchor="middle">have separate controls.</text><text x="320" y="1105" font-size="26" fill="#bbcae2" font-weight="400" text-anchor="middle">Conceptual diagram • not a live UI</text></g>
</svg>
