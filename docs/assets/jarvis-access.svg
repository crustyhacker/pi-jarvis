<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1422" viewBox="0 0 640 1422" role="img" aria-labelledby="title desc">
<title id="title">Access stays in your hands.</title>
<desc id="desc">Conceptual permissions: a fresh main/side owner starts Repo tools, Note main and Redirect OFF. Repo tools opt into read, bash, edit, write and configured side-owned native MCP. Note main delivers a quiet follow-up; Redirect requires visible confirmation for every send. Ordinary close hides presentation without stopping same-owner assigned work or revoking enabled grants, but cannot approve new invisible redirects. Explicit stop clears queued work and requests cancellation; access off revokes all three grants. Owner replacement, side /new, reload, quit and observed trust denial revoke grants. Work is not a detached daemon. Shared memory and archive have separate controls.</desc>
<defs>
<linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#111a32"/><stop offset="1" stop-color="#080f20"/></linearGradient>
<linearGradient id="panel" x2="0" y2="1"><stop stop-color="#18263e"/><stop offset="1" stop-color="#111c31"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#ad87ff"/></linearGradient>
</defs>
<rect width="640" height="1422" rx="28" fill="url(#canvas)"/>
<rect x="1" y="1" width="638" height="1420" rx="27" fill="none" stroke="#344663"/>
<path d="M40 12H600" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="26" fill="#67e8f9" font-weight="600">03 / YOUR PERMISSIONS</text><text x="40" y="94" font-size="34" fill="#edf4ff" font-weight="700">Access stays in your hands.</text><text x="40" y="132" font-size="26" fill="#bbcae2" font-weight="400">Opt in independently. Stay in control.</text><g id="fresh-owner" data-card="fresh-owner" data-bounds="40 164 560 400"><rect x="40" y="164" width="560" height="400" rx="22" fill="url(#panel)" stroke="#344663" stroke-width="1.5"/><text x="64" y="208" font-size="30" fill="#edf4ff" font-weight="700">Fresh owner → three OFF gates</text><text x="64" y="254" font-size="30" fill="#67e8f9" font-weight="700">Repo tools</text><rect x="498" y="225" width="78" height="38" rx="10" fill="#24324a" stroke="#52647f"/><text x="537" y="253" font-size="26" fill="#edf4ff" font-weight="700" text-anchor="middle">OFF</text><text x="64" y="294" font-size="26" fill="#edf4ff" font-weight="400">read • bash • edit • write</text><text x="64" y="332" font-size="26" fill="#bbcae2" font-weight="400">Native MCP • configured, side-owned</text><path d="M64 351H576" fill="none" stroke="#344663" stroke-width="2"/><text x="64" y="390" font-size="30" fill="#c4a5ff" font-weight="700">Note main</text><rect x="498" y="361" width="78" height="38" rx="10" fill="#24324a" stroke="#52647f"/><text x="537" y="389" font-size="26" fill="#edf4ff" font-weight="700" text-anchor="middle">OFF</text><text x="64" y="430" font-size="26" fill="#edf4ff" font-weight="400">Quiet follow-up to the main lane</text><path d="M64 450H576" fill="none" stroke="#344663" stroke-width="2"/><text x="64" y="490" font-size="30" fill="#67e8f9" font-weight="700">Redirect</text><rect x="498" y="461" width="78" height="38" rx="10" fill="#24324a" stroke="#52647f"/><text x="537" y="489" font-size="26" fill="#edf4ff" font-weight="700" text-anchor="middle">OFF</text><text x="64" y="532" font-size="26" fill="#edf4ff" font-weight="400">Visible confirmation for every send</text></g><g id="ordinary-close" data-card="ordinary-close" data-bounds="40 592 560 160"><rect x="40" y="592" width="560" height="160" rx="22" fill="url(#panel)" stroke="#67e8f9" stroke-width="1.5"/><text x="64" y="636" font-size="30" fill="#67e8f9" font-weight="700">Close hides. Work continues.</text><text x="64" y="678" font-size="26" fill="#edf4ff" font-weight="400">Same owner: enabled grants stay on.</text><text x="64" y="718" font-size="26" fill="#bbcae2" font-weight="400">No new invisible Redirect approvals.</text></g><g id="explicit-controls" data-card="explicit-controls" data-bounds="40 780 560 306"><rect x="40" y="780" width="560" height="306" rx="22" fill="url(#panel)" stroke="#344663" stroke-width="1.5"/><text x="64" y="824" font-size="30" fill="#edf4ff" font-weight="700">Explicit controls, no surprises</text><text x="64" y="868" font-size="28" fill="#67e8f9" font-weight="600">/jarvis stop</text><text x="64" y="906" font-size="26" fill="#edf4ff" font-weight="400">Clear queue • request cancellation</text><text x="64" y="952" font-size="28" fill="#c4a5ff" font-weight="600">/jarvis access off</text><text x="64" y="990" font-size="26" fill="#edf4ff" font-weight="400">Revoke Repo tools, Note &amp; Redirect.</text><path d="M64 1012H576" fill="none" stroke="#344663" stroke-width="2"/><text x="64" y="1054" font-size="26" fill="#bbcae2" font-weight="400">/jarvis status → visible in main Pi</text></g><g id="lifetime-boundary" data-card="lifetime-boundary" data-bounds="40 1114 560 192"><rect x="40" y="1114" width="560" height="192" rx="22" fill="url(#panel)" stroke="#344663" stroke-width="1.5"/><text x="64" y="1156" font-size="30" fill="#c4a5ff" font-weight="700">Reset on owner change / teardown</text><text x="64" y="1196" font-size="26" fill="#edf4ff" font-weight="400">Main replacement • side /new</text><text x="64" y="1234" font-size="26" fill="#edf4ff" font-weight="400">Reload / quit • trust denial</text><text x="64" y="1274" font-size="26" fill="#bbcae2" font-weight="400">Background work is not a daemon.</text></g><text x="320" y="1348" font-size="26" fill="#bbcae2" font-weight="400" text-anchor="middle">Memory &amp; archive: separate controls.</text><text x="320" y="1392" font-size="26" fill="#bbcae2" font-weight="400" text-anchor="middle">Conceptual diagram • not a live UI</text></g>
</svg>
