<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1460" viewBox="0 0 640 1460" role="img" aria-labelledby="title desc">
<title id="title">Find the original conversation.</title>
<desc id="desc">Conceptual optional archive workflow: OFF by default, plaintext and unredacted; it may contain secrets. Explicit metadata preview, sensitive confirmation of the reviewed set, bounded import with duplicate skipping and per-file reports, then search with session provenance. Sources are not modified and there is no automatic history import. Human inspection requires enabled archive but not model access; model reads are a separate opt-in and may send retrieved data to the provider even when storage is encrypted. Optional password encryption is off by default and covers only the active archive database, index and journals, not original Pi transcripts, shared memory or retained plaintext backups. Pause effective capture before safe encryption setup.</desc>
<defs>
<linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#111a32"/><stop offset="1" stop-color="#080f20"/></linearGradient>
<linearGradient id="panel" x2="0" y2="1"><stop stop-color="#18263e"/><stop offset="1" stop-color="#111c31"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#ad87ff"/></linearGradient>
</defs>
<rect width="640" height="1460" rx="28" fill="url(#canvas)"/>
<rect x="1" y="1" width="638" height="1458" rx="27" fill="none" stroke="#344663"/>
<path d="M40 12H600" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="26" fill="#67e8f9" font-weight="600">02 / YOUR HISTORY</text><text x="40" y="94" font-size="34" fill="#edf4ff" font-weight="700">Find the original conversation.</text><text x="40" y="132" font-size="26" fill="#bbcae2" font-weight="400">Indexed history, when you choose it.</text><g id="archive-default" data-card="archive-default" data-bounds="40 164 560 112"><rect x="40" y="164" width="560" height="112" rx="22" fill="url(#panel)" stroke="#344663" stroke-width="1.5"/><text x="64" y="207" font-size="30" fill="#67e8f9" font-weight="700">Archive: OFF by default</text><text x="64" y="249" font-size="26" fill="#edf4ff" font-weight="400">Plaintext • unredacted • may hold secrets</text></g><g id="import-workflow" data-card="import-workflow" data-bounds="40 304 560 468"><rect x="40" y="304" width="560" height="468" rx="22" fill="url(#panel)" stroke="#344663" stroke-width="1.5"/><text x="64" y="348" font-size="30" fill="#edf4ff" font-weight="700">Your reviewed import workflow</text><path d="M78 417V469" stroke="#344663" stroke-width="2"/><circle cx="78" cy="388" r="22" fill="#22374e" stroke="#67e8f9"/><text x="78" y="397" font-size="26" fill="#edf4ff" font-weight="700" text-anchor="middle">1</text><text x="116" y="398" font-size="30" fill="#67e8f9" font-weight="700">Preview</text><text x="116" y="434" font-size="26" fill="#edf4ff" font-weight="400">Review files &amp; metadata only</text><path d="M78 513V565" stroke="#344663" stroke-width="2"/><circle cx="78" cy="484" r="22" fill="#22374e" stroke="#c4a5ff"/><text x="78" y="493" font-size="26" fill="#edf4ff" font-weight="700" text-anchor="middle">2</text><text x="116" y="494" font-size="30" fill="#c4a5ff" font-weight="700">Confirm</text><text x="116" y="530" font-size="26" fill="#edf4ff" font-weight="400">Approve the exact reviewed set</text><path d="M78 609V661" stroke="#344663" stroke-width="2"/><circle cx="78" cy="580" r="22" fill="#22374e" stroke="#67e8f9"/><text x="78" y="589" font-size="26" fill="#edf4ff" font-weight="700" text-anchor="middle">3</text><text x="116" y="590" font-size="30" fill="#67e8f9" font-weight="700">Import</text><text x="116" y="626" font-size="26" fill="#edf4ff" font-weight="400">Skip duplicates • per-file reports</text><circle cx="78" cy="676" r="22" fill="#22374e" stroke="#c4a5ff"/><text x="78" y="685" font-size="26" fill="#edf4ff" font-weight="700" text-anchor="middle">4</text><text x="116" y="686" font-size="30" fill="#c4a5ff" font-weight="700">Search</text><text x="116" y="722" font-size="26" fill="#edf4ff" font-weight="400">Browse sessions • see provenance</text></g><text x="64" y="817" font-size="26" fill="#67e8f9" font-weight="600">Sources are not modified.</text><text x="64" y="855" font-size="26" fill="#bbcae2" font-weight="400">No startup scan or automatic import.</text><g id="archive-search" data-card="archive-search" data-bounds="40 886 560 188"><rect x="40" y="886" width="560" height="188" rx="22" fill="url(#panel)" stroke="#344663" stroke-width="1.5"/><text x="64" y="930" font-size="30" fill="#c4a5ff" font-weight="700">Human search ≠ model access</text><text x="64" y="970" font-size="26" fill="#edf4ff" font-weight="400">Human inspection: archive must be on.</text><text x="64" y="1010" font-size="26" fill="#edf4ff" font-weight="400">Model reads: a separate opt-in.</text><text x="64" y="1048" font-size="26" fill="#bbcae2" font-weight="400">Provider may see reads—even encrypted.</text></g><g id="encryption-boundary" data-card="encryption-boundary" data-bounds="40 1102 560 284"><rect x="40" y="1102" width="560" height="284" rx="22" fill="url(#panel)" stroke="#c4a5ff" stroke-width="1.5"/><text x="64" y="1146" font-size="30" fill="#c4a5ff" font-weight="700">Optional password encryption</text><text x="64" y="1186" font-size="26" fill="#67e8f9" font-weight="400">OFF by default • archive only</text><text x="64" y="1224" font-size="26" fill="#edf4ff" font-weight="400">Protects active DB, index &amp; journals.</text><path d="M64 1244H576" fill="none" stroke="#344663" stroke-width="2"/><text x="64" y="1282" font-size="26" fill="#bbcae2" font-weight="400">Not original Pi transcripts, memory,</text><text x="64" y="1320" font-size="26" fill="#bbcae2" font-weight="400">or retained plaintext backups.</text><text x="64" y="1358" font-size="26" fill="#67e8f9" font-weight="400">Pause capture before safe setup.</text></g><text x="320" y="1430" font-size="26" fill="#bbcae2" font-weight="400" text-anchor="middle">Conceptual diagram • not a live UI</text></g>
</svg>
